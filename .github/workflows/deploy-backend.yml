name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "requirements.txt"
      - "dockerfile"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pull and restart the backend over SSH
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/trivia_deploy"
          chmod 600 "$HOME/.ssh/trivia_deploy"

          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            # Accept the whole ssh-keyscan output; strip comments/blank lines.
            printf '%s\n' "$SSH_KNOWN_HOSTS" \
              | tr -d '\r' \
              | grep -vE '^[[:space:]]*(#|$)' > "$HOME/.ssh/known_hosts"
          else
            # Fallback if SERVER_KNOWN_HOSTS isn't configured.
            ssh-keyscan -H "$SSH_HOST" 2>/dev/null \
              | grep -vE '^[[:space:]]*(#|$)' > "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"

          ssh -i "$HOME/.ssh/trivia_deploy" \
            -o IdentitiesOnly=yes \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR="${APP_DIR:-/home/ubuntu/trivia}"
          SERVICE="${SERVICE:-trivia}"
          HEALTH_URL="${HEALTH_URL:-http://127.0.0.1:8000/stats}"

          cd "$APP_DIR"
          PREVIOUS_COMMIT=$(git rev-parse HEAD)

          git fetch --prune origin main
          git pull --ff-only origin main

          # Install changed Python dependencies before restarting. Adjust the
          # venv path if your service uses a different one.
          if git diff --name-only "$PREVIOUS_COMMIT" HEAD -- requirements.txt | grep -q .; then
            VENV_PIP="$APP_DIR/server/venv/bin/pip"
            if [ -x "$VENV_PIP" ]; then
              "$VENV_PIP" install -r "$APP_DIR/requirements.txt"
            else
              echo "Warning: requirements.txt changed but $VENV_PIP was not found"
            fi
          fi

          if ! sudo -n systemctl restart "$SERVICE"; then
            echo "Restart failed; rolling back to $PREVIOUS_COMMIT"
            git reset --hard "$PREVIOUS_COMMIT"
            sudo -n systemctl restart "$SERVICE" || true
            exit 1
          fi

          # Give the server a moment, then verify it is actually responding.
          for attempt in 1 2 3 4 5; do
            if curl -fsS "$HEALTH_URL" >/dev/null 2>&1; then
              echo "Deployed $(git rev-parse --short HEAD) to $SERVICE"
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Health check failed at $HEALTH_URL"
              journalctl -u "$SERVICE" -n 50 --no-pager || true
              echo "Rolling back to $PREVIOUS_COMMIT"
              git reset --hard "$PREVIOUS_COMMIT"
              sudo -n systemctl restart "$SERVICE" || true
              exit 1
            fi

            sleep 2
          done
          REMOTE_SCRIPT
